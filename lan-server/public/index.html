<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>School LAN examination</title><style>body{font:18px system-ui;background:#f1f5f9;color:#0f172a;max-width:950px;margin:auto;padding:24px}section,article{background:white;padding:24px;border-radius:16px;margin:16px 0}button,input{font:inherit;padding:12px;margin:6px;border:1px solid #94a3b8;border-radius:8px}button{cursor:pointer}button:disabled{opacity:.5}label{display:block;padding:10px}img{max-width:100%;max-height:350px}#status{white-space:pre-wrap}#timer{font-weight:bold}nav{display:flex;flex-wrap:wrap}h2{white-space:pre-wrap}</style></head><body><h1>School LAN examination</h1><p id="device"></p><p id="status" role="status"></p><section id="login"><label>Your personal LAN exam ticket<input id="ticket" type="password" autocomplete="off"></label><button id="start">Start / continue exam</button><p>Your school must prepare this paper before internet access is lost. Keep this browser data until your supervisor confirms receipt.</p></section><main id="exam" hidden><h2 id="title"></h2><p id="timer"></p><p id="progress"></p><nav id="palette"></nav><article><h2 id="question"></h2><img id="diagram" alt="" hidden><div id="options"></div></article><button id="previous">Previous</button><button id="next">Next</button><button id="submit">Submit exam</button><button id="retry">Retry upload</button><button id="exit">Sign out</button></main><script type="module" src="/app.js"></script></body></html>
