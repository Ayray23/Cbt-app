name: School CBT checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cbt-app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --prefix cbt-app
      - run: npm test
      - run: npm run lint --prefix cbt-app
      - run: npm run build --prefix cbt-app
      - run: npm run test:rules --prefix cbt-app
      - run: npm run test:api --prefix cbt-app
      - run: npx --prefix cbt-app playwright install --with-deps chromium
      - run: npm run test:browser --prefix cbt-app
      - run: npm audit --omit=dev --audit-level=high --prefix cbt-app
      - run: npm ci --prefix cloud-functions/functions
      - run: npm run lint --prefix cloud-functions/functions
      - run: npm audit --omit=dev --audit-level=high --prefix cloud-functions/functions
