name: LAN exam service tests
on:
  pull_request:
    paths:
      - "lan-server/**"
      - ".github/workflows/lan-tests.yml"
  push:
    paths:
      - "lan-server/**"
      - ".github/workflows/lan-tests.yml"
jobs:
  lan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: lan-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: LAN exam service integration tests
        run: npm test
