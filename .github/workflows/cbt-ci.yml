name: CBT quality checks

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cbt-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cbt-app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run automated tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
